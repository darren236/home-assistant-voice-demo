<rect x="396" y="244" width="540" height="220" fill="#e8f1ed" stroke="#d7dfdb"/>
<text class="heading" x="408" y="272">Galaxy A52s · OpenMOSS inference</text>
<text class="detail" x="408" y="296">MOSS-TTS-Nano 100M · INT8 dense layers</text>
<text class="detail" x="408" y="320">Text + reference codes → audio tokens</text>
