<text class="detail" x="662" y="646">Home Assistant → VACA</text>
<path class="flow" d="M564 640H650"/>
<path class="rule" d="M16 706H944"/>
<text class="detail" x="24" y="733">Fresh replies may start with a thinking cue. After answer PCM, failure ends the reply without replay.</text>
<text class="detail" x="24" y="759">OpenMOSS supplies the models. Routing, conversion, scheduling and playback are project work.</text>
